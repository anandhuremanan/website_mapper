name: CI

# Checks the Go API only; the web client is built and deployed by Vercel.
on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# Newer commits on the same branch or PR replace runs still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race -short ./...

      - name: Build
        run: go build -o /dev/null ./cmd/server
