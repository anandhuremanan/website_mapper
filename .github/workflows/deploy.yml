name: Deploy Web Scanner backend

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of racing an older one.
concurrency:
  group: deploy-websitemapper
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector needs cgo, which the Linux runner has. Some tests
      # measure timing and are sensitive to the race detector's slowdown, so
      # this step reports problems without blocking the deploy.
      - name: Test with race detector
        continue-on-error: true
        run: go test -race -short ./...

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Build Linux backend
        working-directory: server
        run: |
          set -euo pipefail

          # Static binary: no cgo, so it runs on the VPS without extra libraries.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -o ../websitemapper-backend \
            ./cmd/server

          chmod 750 ../websitemapper-backend

          file ../websitemapper-backend

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -p "$VPS_SSH_PORT" \
            -H "$VPS_HOST" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      - name: Upload backend artifact
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -P "$VPS_SSH_PORT" \
            websitemapper-backend \
            "$VPS_USER@$VPS_HOST:/opt/deploy/state/websitemapper/incoming/websitemapper-backend-$COMMIT_SHA"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "/opt/deploy/deploy-service.sh /opt/deploy/services/websitemapper.conf '$COMMIT_SHA' '/opt/deploy/state/websitemapper/incoming/websitemapper-backend-$COMMIT_SHA'"
