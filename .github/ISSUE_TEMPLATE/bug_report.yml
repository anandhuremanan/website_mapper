name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! For security problems, please do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The domain (if you can share it), the scan mode, and the steps.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Server log lines, API responses or browser console errors.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA or date of the code you ran, and whether it was local or deployed.
